name: 写真を同期して公開

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
    paths:
      - config.json
      - sync_drive.py
      - .github/workflows/sync.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: ファイルを取得
        uses: actions/checkout@v4
      - name: Pythonを準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 画像変換機能を準備
        run: pip install Pillow==11.3.0
      - name: Google Driveから写真を同期
        run: python sync_drive.py
      - name: GitHub Pagesを準備
        uses: actions/configure-pages@v5
      - name: 公開ファイルをまとめる
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v4
